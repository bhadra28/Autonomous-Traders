[project]
name = "autonomous-traders"
version = "0.1.0"
description = "A trading floor of autonomous AI traders built on the OpenAI Agents SDK and MCP servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "gradio>=6.14.0",
    "ipykernel>=7.2.0",
    "massive>=2.8.0",
    "mcp[cli]>=1.9.0,<2",
    "openai>=2.34.0",
    "openai-agents>=0.15.1",
    "pandas>=2.2.0",
    "plotly>=6.8.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
